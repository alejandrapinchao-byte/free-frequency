<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" preserveAspectRatio="xMidYMid slice">
  <!-- CAPA DE FONDO PROVISIONAL · Cauca rural (amanecer en la montaña). Reemplazable por una ilustración/render final 3:2 con el mismo nombre. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fb8cf"/><stop offset=".45" stop-color="#cfe3d6"/><stop offset=".75" stop-color="#f8e2b4"/></linearGradient>
    <radialGradient id="sun"><stop offset="0" stop-color="#fff7d6"/><stop offset=".35" stop-color="#ffe9a8" stop-opacity=".8"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/></radialGradient>
    <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fbcc2"/><stop offset="1" stop-color="#c6d9d2"/></linearGradient>
    <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6e9a86"/><stop offset="1" stop-color="#a9c8a2"/></linearGradient>
    <linearGradient id="m3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f8a56"/><stop offset="1" stop-color="#7fae5e"/></linearGradient>
    <linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fb25a"/><stop offset=".5" stop-color="#6f9a45"/><stop offset="1" stop-color="#4f7a34"/></linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff6e0" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8a56c"/><stop offset="1" stop-color="#b9824d"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur6"><feGaussianBlur stdDeviation="7"/></filter>
    <g id="tree"><rect x="-5" y="-4" width="10" height="70" rx="4" fill="#6b4a2c"/><ellipse cx="0" cy="-20" rx="70" ry="42" fill="#3d7c43"/><ellipse cx="-30" cy="-8" rx="42" ry="28" fill="#4a8d4b"/><ellipse cx="34" cy="-30" rx="40" ry="24" fill="#58a055"/></g>
  </defs>

  <rect width="1500" height="1000" fill="url(#sky)"/>
  <circle cx="1090" cy="330" r="260" fill="url(#sun)"/>
  <g fill="#fff" opacity=".8" filter="url(#soft)"><ellipse cx="260" cy="170" rx="150" ry="26"/><ellipse cx="360" cy="146" rx="90" ry="24"/><ellipse cx="860" cy="120" rx="170" ry="22"/><ellipse cx="1330" cy="220" rx="110" ry="20"/></g>

  <!-- montanas lejanas -->
  <path d="M0 520 L130 410 L260 470 L420 340 L580 460 L720 380 L880 480 L1040 360 L1200 470 L1340 400 L1500 470 L1500 700 L0 700Z" fill="url(#m1)"/>
  <path d="M420 340 L470 380 L440 392 L400 372Z M1040 360 L1085 396 L1055 404 L1020 384Z" fill="#fff" opacity=".35"/>
  <rect x="0" y="470" width="1500" height="120" fill="url(#fog)"/>
  <!-- montanas medias -->
  <path d="M0 600 L150 500 L320 570 L520 470 L720 580 L900 520 L1100 600 L1280 510 L1500 590 L1500 760 L0 760Z" fill="url(#m2)"/>
  <path d="M520 470 L610 520 L560 560 L500 500Z M1280 510 L1350 548 L1310 580 L1262 540Z" fill="#fff" opacity=".12"/>
  <rect x="0" y="560" width="1500" height="110" fill="url(#fog)" opacity=".8"/>
  <!-- lomas con cafetales -->
  <path d="M0 690 Q260 600 560 660 T1100 640 T1500 670 L1500 820 L0 820Z" fill="url(#m3)"/>
  <g fill="none" stroke="#2f6a3a" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 15" opacity=".55">
    <path d="M40 710 Q280 640 560 690 T1100 670 T1480 700"/><path d="M20 738 Q280 668 560 718 T1100 698 T1480 728"/><path d="M0 768 Q280 698 560 748 T1100 728 T1480 758"/>
  </g>
  <!-- finca lejana -->
  <g transform="translate(1180 626)">
    <rect x="-70" y="-44" width="140" height="62" fill="#f4e6c8"/><path d="M-84 -42 L0 -92 L84 -42Z" fill="#b8553a"/><path d="M-84 -42 L0 -92 L84 -42 L76 -38 L0 -82 L-76 -38Z" fill="#8f3f2a"/>
    <rect x="-8" y="-20" width="26" height="38" fill="#8a5a3a"/><rect x="-52" y="-30" width="24" height="22" fill="#6aa0be"/><rect x="30" y="-30" width="24" height="22" fill="#6aa0be"/>
    <ellipse cx="0" cy="20" rx="92" ry="10" fill="#000" opacity=".12"/>
  </g>
  <use href="#tree" x="1030" y="640" transform="translate(1030 640) scale(.9) translate(-1030 -640)"/>
  <use href="#tree" x="1360" y="650"/>
  <use href="#tree" x="720" y="690" transform="translate(720 690) scale(.7) translate(-720 -690)"/>

  <!-- suelo -->
  <path d="M0 800 Q380 770 760 790 T1500 780 L1500 1000 L0 1000Z" fill="url(#gr)"/>
  <!-- camino de tierra -->
  <path d="M520 1000 Q640 900 880 860 Q1100 826 1220 790 L1290 792 Q1160 850 1020 880 Q880 912 900 1000Z" fill="url(#path)"/>
  <path d="M520 1000 Q640 900 880 860 Q1100 826 1220 790" fill="none" stroke="#fff" stroke-width="3" opacity=".25"/>
  <g fill="#fff" opacity=".18"><ellipse cx="300" cy="900" rx="170" ry="16"/><ellipse cx="1180" cy="930" rx="150" ry="14"/></g>
  <!-- plantas de cafe en hilera -->
  <g>
    <g transform="translate(640 830)"><ellipse rx="52" ry="30" fill="#2f6b34"/><ellipse cx="-22" cy="-8" rx="32" ry="22" fill="#3d7f40"/><ellipse cx="22" cy="-6" rx="32" ry="22" fill="#49914a"/><circle cx="-18" cy="-2" r="5" fill="#c8312b"/><circle cx="10" cy="-14" r="5" fill="#d8382f"/><circle cx="28" cy="2" r="5" fill="#c8312b"/><circle cx="34" cy="-16" r="4" fill="#f0b840"/></g>
    <g transform="translate(1010 770) scale(.8)"><ellipse rx="52" ry="30" fill="#2f6b34"/><ellipse cx="-22" cy="-8" rx="32" ry="22" fill="#3d7f40"/><ellipse cx="22" cy="-6" rx="32" ry="22" fill="#49914a"/><circle cx="-18" cy="-2" r="5" fill="#c8312b"/><circle cx="28" cy="2" r="5" fill="#c8312b"/></g>
    <g transform="translate(1390 840) scale(1.1)"><ellipse rx="52" ry="30" fill="#2f6b34"/><ellipse cx="-22" cy="-8" rx="32" ry="22" fill="#3d7f40"/><ellipse cx="22" cy="-6" rx="32" ry="22" fill="#49914a"/><circle cx="-18" cy="-2" r="5" fill="#c8312b"/><circle cx="10" cy="-14" r="5" fill="#d8382f"/><circle cx="28" cy="2" r="5" fill="#c8312b"/></g>
  </g>
  <!-- aves -->
  <g fill="none" stroke="#3a4a52" stroke-width="3" stroke-linecap="round"><path d="M600 250 q14 -14 28 0 q14 -14 28 0"/><path d="M700 290 q10 -10 20 0 q10 -10 20 0"/><path d="M1180 190 q12 -12 24 0 q12 -12 24 0"/></g>
</svg>
