    <filter id="b8"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="b2"><feGaussianBlur stdDeviation="2"/></filter>
    <linearGradient id="vig" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2a1830" stop-opacity=".5"/><stop offset="1" stop-color="#2a1830" stop-opacity="0"/></linearGradient>
    <linearGradient id="lf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b8a4a"/><stop offset="1" stop-color="#1f5a33"/></linearGradient>
  </defs>
  <rect x="0" y="860" width="1500" height="140" fill="url(#vig)"/>
  <!-- hojas de palma desenfocadas arriba-derecha -->
