    <circle cx="320" cy="660" r="3"/><circle cx="520" cy="540" r="2.5"/><circle cx="760" cy="720" r="3.5"/><circle cx="980" cy="600" r="2.5"/><circle cx="1180" cy="700" r="3"/><circle cx="150" cy="520" r="2"/><circle cx="640" cy="430" r="2"/>
