<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" preserveAspectRatio="xMidYMid slice">
  <!-- CAPA DE FONDO PROVISIONAL · Cali urbana (atardecer polvoriento tras un sismo). Reemplazable por ilustración/render final 3:2 con el mismo nombre. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5f5a92"/><stop offset=".35" stop-color="#c9708a"/><stop offset=".65" stop-color="#f29a6a"/><stop offset="1" stop-color="#ffd08a"/></linearGradient>
    <radialGradient id="sun"><stop offset="0" stop-color="#fff0c0"/><stop offset=".4" stop-color="#ffc47a" stop-opacity=".7"/><stop offset="1" stop-color="#ffc47a" stop-opacity="0"/></radialGradient>
    <linearGradient id="h1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a6f9e"/><stop offset="1" stop-color="#c58a9a"/></linearGradient>
    <linearGradient id="h2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a5f86"/><stop offset="1" stop-color="#b57a86"/></linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b5560"/><stop offset="1" stop-color="#40343f"/></linearGradient>
    <linearGradient id="walk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9b9a0"/><stop offset="1" stop-color="#b78f7c"/></linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd9a0" stop-opacity="0"/><stop offset="1" stop-color="#ffd9a0" stop-opacity=".55"/></linearGradient>
    <pattern id="w1" width="34" height="42" patternUnits="userSpaceOnUse"><rect x="8" y="9" width="18" height="24" rx="2" fill="#5a3a4a" opacity=".55"/><rect x="8" y="9" width="18" height="4" fill="#fff" opacity=".18"/></pattern>
    <pattern id="w2" width="34" height="42" patternUnits="userSpaceOnUse"><rect x="8" y="9" width="18" height="24" rx="9" fill="#5a3a4a" opacity=".5"/></pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="1500" height="1000" fill="url(#sky)"/>
  <circle cx="330" cy="560" r="300" fill="url(#sun)"/>
  <g fill="#fff" opacity=".28" filter="url(#soft)"><ellipse cx="300" cy="200" rx="200" ry="22"/><ellipse cx="1150" cy="150" rx="240" ry="20"/><ellipse cx="760" cy="300" rx="170" ry="16"/></g>

  <!-- cerros tutelares + Cristo Rey -->
  <path d="M0 640 Q140 440 330 520 Q470 430 640 580 L640 720 L0 720Z" fill="url(#h1)"/>
  <g fill="#fbf1e4"><rect x="226" y="410" width="8" height="68" rx="3"/><rect x="204" y="426" width="52" height="8" rx="3"/><circle cx="230" cy="404" r="8"/></g>
  <path d="M560 660 Q820 540 1080 620 Q1300 540 1500 630 L1500 760 L560 760Z" fill="url(#h2)" opacity=".9"/>

  <!-- horizonte urbano lejano -->
  <g fill="#b88aa0" opacity=".85">
    <rect x="610" y="540" width="70" height="230"/><rect x="690" y="500" width="64" height="270"/><rect x="760" y="560" width="84" height="210"/>
    <rect x="1230" y="520" width="70" height="250"/><rect x="1310" y="560" width="84" height="210"/><rect x="1400" y="500" width="70" height="270"/>
  </g>
  <!-- Torre de Cali (referencia, provisional) -->
  <g>
    <rect x="928" y="330" width="60" height="440" fill="#d9bfc4"/><rect x="928" y="330" width="60" height="440" fill="url(#w2)"/>
    <rect x="916" y="312" width="84" height="22" fill="#bfa0aa"/><rect x="938" y="284" width="40" height="30" fill="#d9bfc4"/><rect x="956" y="226" width="4" height="62" fill="#8a6a7a"/><circle cx="958" cy="224" r="5" fill="#ff5a4a"/>
  </g>
  <!-- edificios medios, ladrillo y pastel -->
  <g>
    <rect x="640" y="520" width="150" height="250" fill="#d98a6a"/><rect x="640" y="520" width="150" height="250" fill="url(#w1)"/><rect x="632" y="508" width="166" height="16" fill="#b86a4e"/>
    <rect x="1040" y="470" width="170" height="300" fill="#e8c28f"/><rect x="1040" y="470" width="170" height="300" fill="url(#w2)"/><rect x="1032" y="458" width="186" height="16" fill="#c99b68"/>
    <rect x="800" y="600" width="110" height="170" fill="#c8566e"/><rect x="800" y="600" width="110" height="170" fill="url(#w1)"/>
    <rect x="1230" y="580" width="140" height="190" fill="#9cb7a8"/><rect x="1230" y="580" width="140" height="190" fill="url(#w1)"/>
  </g>
  <!-- edificio con grietas (sismo) a la izquierda -->
  <g>
    <rect x="0" y="400" width="250" height="400" fill="#b5523a"/><rect x="0" y="400" width="250" height="400" fill="url(#w1)"/><rect x="0" y="388" width="262" height="18" fill="#8a3a28"/>
    <path d="M120 400 L132 470 L116 520 L138 600 L126 680" fill="none" stroke="#2b1a1a" stroke-width="5" stroke-linejoin="round" opacity=".75"/>
    <path d="M132 470 L170 486 M138 600 L100 616" fill="none" stroke="#2b1a1a" stroke-width="3" opacity=".6"/>
  </g>
  <!-- palma y ceiba -->
  <g>
    <rect x="590" y="520" width="10" height="260" fill="#6b4a2c"/>
    <g stroke="#2f7a3a" stroke-width="9" stroke-linecap="round" fill="none"><path d="M595 520 q-60 -16 -96 24"/><path d="M595 520 q-36 -56 -84 -50"/><path d="M595 520 q60 -16 96 24"/><path d="M595 520 q36 -56 84 -50"/><path d="M595 520 q0 -64 0 -84"/></g>
  </g>
  <!-- calle -->
  <rect x="0" y="770" width="1500" height="230" fill="url(#road)"/>
  <rect x="0" y="750" width="1500" height="30" fill="url(#walk)"/><rect x="0" y="776" width="1500" height="6" fill="#00000022"/>
  <g fill="#f3d26a" opacity=".9"><rect x="40" y="900" width="140" height="9"/><rect x="290" y="900" width="140" height="9"/><rect x="540" y="900" width="140" height="9"/><rect x="790" y="900" width="140" height="9"/><rect x="1040" y="900" width="140" height="9"/><rect x="1290" y="900" width="140" height="9"/></g>
  <!-- poste inclinado y cables -->
  <g stroke="#2b1f2a" fill="none" opacity=".7">
    <path d="M1150 310 L1196 780" stroke-width="9"/><path d="M1126 332 L1236 340" stroke-width="6"/>
    <path d="M0 300 Q300 360 700 320 T1150 330" stroke-width="2"/><path d="M0 320 Q300 380 700 340 T1150 350" stroke-width="2"/>
    <path d="M1236 340 Q1380 380 1500 350" stroke-width="2"/>
  </g>
  <!-- bruma de polvo -->
  <rect x="0" y="560" width="1500" height="300" fill="url(#haze)"/>
</svg>
